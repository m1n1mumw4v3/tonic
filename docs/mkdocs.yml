site_name: Estus Internal Wiki
site_description: Personal reference for how the Estus app's logic works under the hood.
site_author: Matt Gierl
site_url: ""
use_directory_urls: true
strict: true

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: white
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - State Management: architecture/state-management.md
      - Persistence: architecture/persistence.md
      - Data Models: architecture/data-models.md
  - Engines:
      - Recommendation Engine: engines/recommendation-engine.md
      - Onboarding Fields → Plan: engines/onboarding-fields.md
      - Personalization Scorer: engines/personalization-scorer.md
      - Safety Rules: engines/safety-rules.md
      - Supplement Name Matcher: engines/supplement-name-matcher.md
      - Check-In Insight Generator: engines/check-in-insight-generator.md
  - Knowledge Bases:
      - Supplement KB: knowledge-bases/supplement-kb.md
      - Medication KB: knowledge-bases/medication-kb.md
      - Knowledge Base Mapper: knowledge-bases/knowledge-base-mapper.md
      - Supplement Catalog: knowledge-bases/supplement-catalog.md
  - Flows:
      - Onboarding: flows/onboarding.md
      - Daily Check-In: flows/daily-check-in.md
      - Plan Management: flows/plan-management.md
      - Insights & Timeline: flows/insights-timeline.md
  - Cross-Cutting:
      - Scoring Pipeline: cross-cutting/scoring-pipeline.md
      - Interaction Checking: cross-cutting/interaction-checking.md
      - Text Generation: cross-cutting/text-generation.md
  - Contributing: contributing.md
